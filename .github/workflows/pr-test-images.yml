# Builds pullable Docker test images for YOUR open pull requests on upstream MeshCentral.
#
# Every image is "latest upstream master + PR(s)". The PR code is merged onto the current
# upstream master, so testers get today's master plus your change and nobody else's PRs.
#
#   ghcr.io/<owner>/meshcentral:pr-<number>   one image per open PR of yours
#   ghcr.io/<owner>/meshcentral:my-prs        all your open PRs merged together
#                                              (a PR that conflicts with the others is left out
#                                              and listed in the run summary)
#
# Each build also gets a fixed tag like pr-8301-20261105-2123 that never moves.
#
# It runs every hour and only rebuilds an image when upstream master or the PR has new commits.
# Use "Run workflow" on the Actions tab to build right away (optionally one PR, or forced).
# PR author defaults to the owner of this repo; set the PR_AUTHOR repository variable to change it.

name: PR test images

on:
  schedule:
    - cron: '23 * * * *' # hourly
  workflow_dispatch:
    inputs:
      pr:
        description: 'Only build this upstream PR number (leave blank for all of your open PRs)'
        required: false
        default: ''
      force:
        description: 'Rebuild even if the image is already up to date'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: pr-test-images
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Ylianst/MeshCentral
  UPSTREAM_BRANCH: master
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  plan:
    name: Find PRs to build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: List open PRs and skip images that are already up to date
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ vars.PR_AUTHOR || github.repository_owner }}
          ONLY_PR: ${{ inputs.pr }}
          FORCE: ${{ inputs.force }}
          OWNER: ${{ github.repository_owner }}
          BUILDER_SHA: ${{ github.sha }} # my-prs also depends on the saved resolutions in this repo
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/meshcentral"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          base=$(gh api "repos/$UPSTREAM_REPO/commits/$UPSTREAM_BRANCH" --jq .sha)
          echo "Upstream $UPSTREAM_REPO@$UPSTREAM_BRANCH is at $base"

          prs=$(gh pr list --repo "$UPSTREAM_REPO" --author "$PR_AUTHOR" --state open --limit 100 \
                  --json number,title,headRefOid,url | jq -c 'sort_by(.number)')
          if [ -n "$ONLY_PR" ]; then
            prs=$(jq -c --argjson n "$ONLY_PR" '[.[] | select(.number == $n)]' <<<"$prs")
            if [ "$(jq length <<<"$prs")" != 1 ]; then
              echo "::error::#$ONLY_PR is not an open PR by $PR_AUTHOR in $UPSTREAM_REPO"
              exit 1
            fi
          fi
          echo "Open PRs by $PR_AUTHOR:"; jq -r '.[] | "  #\(.number) \(.title)"' <<<"$prs"

          # One image per PR, plus a combined image when there are two or more.
          # "key" captures exactly what went into an image; it is stored as an image label.
          candidates=$(jq -c --arg base "$base" '[.[] | {
              tag: "pr-\(.number)", prs: "\(.number)", title: .title,
              base: $base, key: "\($base)+\(.headRefOid)" }]' <<<"$prs")
          if [ -z "$ONLY_PR" ] && [ "$(jq length <<<"$prs")" -ge 2 ]; then
            candidates=$(jq -c --arg base "$base" --argjson p "$prs" --arg builder "$BUILDER_SHA" '. + [{
                tag: "my-prs", prs: ([$p[].number | tostring] | join(" ")),
                title: "All open PRs combined", base: $base,
                key: ([$base] + [$p[].headRefOid] + [$builder] | join("+")) }]' <<<"$candidates")
          fi

          matrix='[]'
          while read -r c; do
            [ -n "$c" ] || continue
            tag=$(jq -r .tag <<<"$c"); key=$(jq -r .key <<<"$c")
            current=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Image}}' 2>/dev/null \
                        | jq -r '(if has("config") then . else (to_entries[0].value) end)
                                 | .config.Labels["io.github.pr-test-images.key"] // ""' 2>/dev/null || true)
            if [ "$FORCE" != "true" ] && [ "$current" = "$key" ]; then
              echo "$tag: up to date, skipping"
            else
              echo "$tag: needs a build"
              matrix=$(jq -c --argjson c "$c" '. + [$c]' <<<"$matrix")
            fi
          done < <(jq -c '.[]' <<<"$candidates")

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<<"$matrix")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.tag }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Get saved conflict resolutions
        uses: actions/checkout@v5
        with:
          path: builder
          sparse-checkout: rerere

      - name: Merge PR(s) onto latest upstream master
        id: src
        env:
          PRS: ${{ matrix.prs }}
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          git init -q src && cd src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          refspecs=()
          for n in $PRS; do refspecs+=("+refs/pull/$n/head:refs/remotes/pr/$n"); done
          # Shallow but complete fetch. (A blob:none partial clone made merges fetch files lazily,
          # which GitHub sometimes refuses with "not our ref".)
          git fetch -q --depth=300 upstream "$BASE" "${refspecs[@]}"
          git checkout -q --detach "$BASE"

          # Saved resolutions for places where two of the PRs change the same lines (see rerere/ and
          # the README). Git re-applies one only when it meets exactly the same conflict again.
          git config rerere.enabled true
          git config rerere.autoupdate true
          mkdir -p .git/rr-cache
          if [ -d ../builder/rerere ]; then cp -r ../builder/rerere/. .git/rr-cache/; fi

          for n in $PRS; do
            tries=0
            until git merge-base HEAD "pr/$n" >/dev/null 2>&1; do
              tries=$((tries + 1))
              if [ $tries -gt 5 ]; then echo "::error::No shared history found for PR #$n"; exit 1; fi
              echo "PR #$n branched off long ago; fetching more history"
              git fetch -q --deepen=500 upstream "$BASE" "${refspecs[@]}"
            done
          done

          # After a conflicted merge: true only if saved resolutions fixed every file, no conflict
          # markers are left, and every changed JavaScript/JSON file still parses.
          resolved_ok() {
            [ -z "$(git diff --name-only --diff-filter=U)" ] || return 1
            ! git diff --cached | grep -qE '^\+(<<<<<<<|>>>>>>>) ' || return 1
            local f
            for f in $(git diff --cached --name-only --diff-filter=AM); do
              case "$f" in
                *.js)   node --check "$f" >/dev/null 2>&1 || { echo "Saved resolution broke $f"; return 1; } ;;
                *.json) python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f" 2>/dev/null || { echo "Saved resolution broke $f"; return 1; } ;;
              esac
            done
          }

          included=(); skipped=()
          for n in $PRS; do
            if git merge -q --no-ff --no-edit -m "Merge upstream PR #$n" "pr/$n"; then
              included+=("$n")
            elif resolved_ok; then
              git commit -q --no-edit
              included+=("$n")
              echo "PR #$n overlaps the PRs before it; applied the saved resolution"
            else
              echo "Unresolved: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git merge --abort
              skipped+=("$n")
              echo "::warning::PR #$n does not merge cleanly onto upstream $UPSTREAM_BRANCH (or with the PRs before it) and there is no saved resolution for it; left out of ${{ matrix.tag }}"
            fi
          done
          if [ ${#included[@]} -eq 0 ]; then
            echo "::error::Nothing to build: PR #$PRS no longer merges cleanly onto upstream $UPSTREAM_BRANCH. Rebase or merge master into the PR branch."
            exit 1
          fi
          git log --oneline -n $(( ${#included[@]} * 2 + 1 ))

          echo "included=${included[*]}" >> "$GITHUB_OUTPUT"
          echo "skipped=${skipped[*]:-}" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "heads=$(for n in "${included[@]}"; do printf '#%s@%s ' "$n" "$(git rev-parse --short pr/$n)"; done)" >> "$GITHUB_OUTPUT"

      # Same preparation the official image builds do before running the Dockerfile.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Extract, minify and translate
        working-directory: src/translate
        run: |
          node translate.js || true
          node translate extractall
          node translate.js minifyall
          node translate.js translateall

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ env.PLATFORMS }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.plan.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=raw,value=${{ matrix.tag }}-${{ steps.src.outputs.stamp }}
          labels: |
            org.opencontainers.image.title=MeshCentral test build ${{ matrix.tag }}
            org.opencontainers.image.description=Unofficial test image: ${{ env.UPSTREAM_REPO }} ${{ env.UPSTREAM_BRANCH }} + PR(s) ${{ steps.src.outputs.heads }}
            org.opencontainers.image.revision=${{ matrix.base }}
            io.github.pr-test-images.key=${{ matrix.key }}
            io.github.pr-test-images.upstream=${{ env.UPSTREAM_REPO }}@${{ matrix.base }}
            io.github.pr-test-images.prs=${{ steps.src.outputs.heads }}
            io.github.pr-test-images.skipped=${{ steps.src.outputs.skipped }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: src
          file: src/docker/Dockerfile
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DISABLE_MINIFY=yes
            DISABLE_TRANSLATE=yes
            DISABLE_EXTRACT=yes

      - name: Summary
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          TAG: ${{ matrix.tag }}
          STAMP: ${{ steps.src.outputs.stamp }}
          INCLUDED: ${{ steps.src.outputs.included }}
          SKIPPED: ${{ steps.src.outputs.skipped }}
          BASE: ${{ matrix.base }}
        run: |
          {
            echo "## \`$IMAGE:$TAG\`"
            echo
            echo "Upstream \`$UPSTREAM_BRANCH\` at [\`${BASE:0:7}\`](https://github.com/$UPSTREAM_REPO/commit/$BASE) plus:"
            for n in $INCLUDED; do echo "- https://github.com/$UPSTREAM_REPO/pull/$n"; done
            if [ -n "$SKIPPED" ]; then
              echo
              echo "**Left out (merge conflict):**"
              for n in $SKIPPED; do echo "- https://github.com/$UPSTREAM_REPO/pull/$n"; done
            fi
            echo
            echo "To test it:"
            echo '```'
            echo "docker pull $IMAGE:$TAG"
            echo '```'
            echo "Or in compose.yaml: \`image: $IMAGE:$TAG\`"
            echo
            echo "This exact build never changes under the tag \`$TAG-$STAMP\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Once a day (and on every manual run) delete:
  #   - every tag of a PR that is no longer open (merged or closed)
  #   - fixed build tags (pr-123-20261105-2134) older than RETENTION_DAYS
  #   - untagged leftovers (the per-architecture parts of deleted images)
  # The moving tags (pr-123 for open PRs, my-prs) are always kept, as is any tag this
  # workflow did not create. Needs the package's "Manage Actions access" to give this
  # repository the Admin role.
  cleanup:
    name: Clean up old images
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RETENTION_DAYS: 30
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete images of closed PRs and builds older than ${{ env.RETENTION_DAYS }} days
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ vars.PR_AUTHOR || github.repository_owner }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = schedule ] && [ "$(date -u +%H)" != "03" ]; then
            echo "Scheduled cleanup only runs once a day (03:xx UTC); manual runs always clean up."
            exit 0
          fi
          api="users/${OWNER,,}/packages/container/meshcentral/versions"

          open=$(gh pr list --repo "$UPSTREAM_REPO" --author "$PR_AUTHOR" --state open --limit 100 \
                   --json number --jq '[.[].number]')
          versions=$(gh api --paginate "$api?per_page=100" \
                       --jq '.[] | {id, digest: .name, created_at, tags: .metadata.container.tags}' | jq -s .)
          cutoff=$(date -u -d "-$RETENTION_DAYS days" +%Y-%m-%dT%H:%M:%SZ)
          untagged_cutoff=$(date -u -d "-1 day" +%Y-%m-%dT%H:%M:%SZ)
          echo "Open PRs: $open. Package has $(jq length <<<"$versions") versions. Deleting builds from before $cutoff."

          # Decide what to do with every tagged version.
          decisions=$(jq -c --argjson open "$open" --arg cutoff "$cutoff" '
            def ours:   test("^(pr-[0-9]+|my-prs)(-[0-9]{8}-[0-9]{4})?$");
            def moving: test("^(pr-[0-9]+|my-prs)$");
            def closed: (capture("^pr-(?<n>[0-9]+)") | .n | tonumber) as $n | ($open | any(. == $n)) | not;
            [ .[] | select(.tags | length > 0) | . + { action: (
                if   any(.tags[]; ours | not)                            then "keep"
                elif any(.tags[]; startswith("pr-") and closed)          then "delete: PR closed"
                elif any(.tags[]; moving)                                then "keep"
                elif .created_at < $cutoff                               then "delete: older than retention"
                else "keep" end) } ]' <<<"$versions")

          # Everything a kept image refers to (per-architecture images, attestations) must stay.
          keep_digests=$(jq -r '.[] | select(.action == "keep") | .digest' <<<"$decisions")
          referenced=$(for d in $keep_digests; do
                         echo "$d"
                         docker buildx imagetools inspect --raw "$IMAGE@$d" | jq -r '.manifests[]?.digest'
                       done | sort -u | jq -R . | jq -sc .)

          to_delete=$(jq -c --argjson decisions "$decisions" --argjson referenced "$referenced" \
                         --arg ucut "$untagged_cutoff" '
            [ ($decisions[] | select(.action != "keep")),
              (.[] | select((.tags | length) == 0 and .created_at < $ucut
                            and (.digest as $d | $referenced | any(.[]; . == $d) | not))
                   | . + {action: "delete: untagged leftover"}) ]' <<<"$versions")

          echo "Keeping $(jq '[.[] | select(.action == "keep")] | length' <<<"$decisions") tagged versions; deleting $(jq length <<<"$to_delete")."
          deleted=0
          while read -r v; do
            [ -n "$v" ] || continue
            id=$(jq -r .id <<<"$v")
            echo "$(jq -r '.action' <<<"$v"): $(jq -r 'if (.tags | length) > 0 then (.tags | join(", ")) else .digest end' <<<"$v")"
            if ! out=$(gh api -X DELETE "$api/$id" 2>&1); then
              echo "$out"
              if grep -qiE '403|permission|forbidden' <<<"$out"; then
                echo "::error::No permission to delete images. Open the meshcentral package settings on GitHub → Manage Actions access → add the ${{ github.repository }} repository with the Admin role."
              fi
              exit 1
            fi
            deleted=$((deleted + 1))
          done < <(jq -c '.[]' <<<"$to_delete")
          echo "### Cleanup: deleted $deleted image versions" >> "$GITHUB_STEP_SUMMARY"
